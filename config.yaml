# ABA利基分析工具 v5.0 配置文件

market_filter:
  min_monthly_sales: 30000
  min_avg_price: 20.0
  max_avg_review_count: 500
  max_brand_concentration: 0.60

trend:
  growth_threshold: 0.15
  decline_threshold: -0.05
  stable_threshold: 0.05

review_mining:
  min_mentions: 3
  sample_size_warning: 100

column_mapping:
  similarity_threshold: 0.8
  confirm_threshold: 0.5

color_mapping:
  - regex: "(?i)\\b(black|pure black|carbon fiber black|black top|black\\s*frame)\\b"
    standard: "黑色"
  - regex: "(?i)\\b(white|pure white|soft white|white top|white\\s*frame)\\b"
    standard: "白色"
  - regex: "(?i)\\b(light walnut|light walnut top|walnut.*white|natural|natural oak)\\b"
    standard: "浅胡桃色"
  - regex: "(?i)\\b(dark walnut|black walnut|walnut.*black|walnut)\\b"
    standard: "深胡桃色"
  - regex: "(?i)\\b(rustic brown|vintage brown|brown|rustic)\\b"
    standard: "棕色"
  - regex: "(?i)\\b(oak|oak top)\\b"
    standard: "橡木色"
  - regex: "(?i)\\b(\\d{2})\\s*(?:x\\s*\\d{2})?\\s*(?:-inch|inch|in|\\\"|寸)"
    standard: "{matched}寸"
